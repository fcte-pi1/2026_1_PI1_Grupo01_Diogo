services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi1-backend
    environment:
      DATABASE_URL: file:/app/data/dev.db
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - backend-sqlite-data:/app/data
    restart: unless-stopped

volumes:
  backend-sqlite-data:

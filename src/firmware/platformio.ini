; Bancada WebSocket isolada: streama telemetria falsa para o backend (sem
; sensores/navegação), para validar a ponta firmware->backend.
[env:teste_ws]
extends = esp32
build_src_filter = +<*> -<main.cpp> -<scripts_teste/> +<scripts_teste/teste_ws.cpp>

; Teste NATIVE (roda no PC, sem ESP): valida a lógica pura do contrato de
; telemetria. Só compila o módulo puro (telemetria_contrato) + os testes Unity.
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -I src
lib_deps = bblanchon/ArduinoJson
; Compila o src junto do teste (por padrão o pio test não faz isso) e restringe
; ao módulo puro do contrato — os demais .cpp dependem de Arduino/WiFi.
test_build_src = yes
build_src_filter = -<*> +<comunicacao/telemetria_contrato.cpp>

; Base comum dos ambientes que rodam NA ESP32. Os envs abaixo herdam via
; `extends = esp32`. O env `native` NÃO herda (roda no PC), por isso a base fica
; numa seção própria em vez de `[env]` (que seria aplicada a todos os envs).
[esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    pololu/VL53L0X
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor
    bblanchon/ArduinoJson
    madhephaestus/ESP32Encoder
    links2004/WebSockets

[env:producao]
extends = esp32
build_src_filter = +<*> -<scripts_teste/>

[env:teste_encoders]
extends = esp32
build_src_filter = +<*> -<main.cpp> -<scripts_teste/> +<scripts_teste/teste_encoders.cpp>

[env:teste_motores]
extends = esp32
build_src_filter = +<*> -<main.cpp> -<scripts_teste/> +<scripts_teste/teste_motores.cpp>

[env:teste_imu]
extends = esp32
build_src_filter = +<*> -<main.cpp> -<scripts_teste/> +<scripts_teste/teste_imu.cpp>

[env:teste_tof]
extends = esp32
build_src_filter = +<*> -<main.cpp> -<scripts_teste/> +<scripts_teste/teste_tof.cpp>

[env:teste_reta_imu]
extends = esp32
build_src_filter = +<*> -<main.cpp> -<scripts_teste/> +<scripts_teste/teste_reta_imu.cpp>

[env:teste_giro_imu]
extends = esp32
build_src_filter = +<*> -<main.cpp> -<scripts_teste/> +<scripts_teste/teste_giro_imu.cpp>

[env:teste_conexao]
extends = esp32
build_src_filter = +<*> -<main.cpp> -<scripts_teste/> +<scripts_teste/teste_conexao.cpp>

[env:teste_giro_stress]
extends = esp32
build_src_filter = +<*> -<main.cpp> -<scripts_teste/> +<scripts_teste/teste_giro_stress.cpp>

[env:teste_encoders_wifi]
extends = esp32
build_src_filter = +<*> -<main.cpp> -<scripts_teste/> +<scripts_teste/teste_encoders_wifi.cpp>

[env:teste_tof_wifi]
extends = esp32
build_src_filter = +<*> -<main.cpp> -<scripts_teste/> +<scripts_teste/teste_tof_wifi.cpp>

[env:teste_ws]
extends = esp32
build_src_filter = +<*> -<main.cpp> -<scripts_teste/> +<scripts_teste/teste_ws.cpp>

; Teste NATIVE (roda no PC, sem ESP): valida a lógica pura do contrato de
; telemetria. Só compila o módulo puro (telemetria_contrato) + os testes Unity.
;   pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=c++17 -I src
lib_deps = bblanchon/ArduinoJson
build_src_filter = -<*> +<comunicacao/telemetria_contrato.cpp>
